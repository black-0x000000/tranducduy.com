<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Quản lý tài khoản - Firebase</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="toast" class="toast"></div>

<!-- Modal xác nhận -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal-box">
        <div class="modal-icon">⚠️</div>
        <div class="modal-title">Xác nhận xóa</div>
        <div class="modal-subtitle">
            Bạn có chắc chắn muốn xóa tài khoản <strong id="deleteUsername">"user"</strong>?
            <br>Hành động này <strong style="color:#ff6b6b;">không thể hoàn tác</strong>.
        </div>
        <div class="modal-actions">
            <button class="modal-btn cancel" id="modalCancel">Hủy</button>
            <button class="modal-btn confirm" id="modalConfirm">Xóa ngay</button>
        </div>
    </div>
</div>

<!-- Login -->
<div id="login-container" style="display:block;">
    <h2>🚀 Đăng nhập</h2>
    <p class="subtitle">Hệ thống quản lý tài khoản</p>
    <div class="login-field">
        <label>👤 Tên đăng nhập</label>
        <input type="text" id="loginUsername" placeholder="Nhập tên đăng nhập" />
    </div>
    <div class="login-field">
        <label>🔒 Mật khẩu</label>
        <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" />
    </div>
    <button class="login-btn" id="loginBtn">Đăng nhập</button>
    <div id="loginError" class="login-error"></div>
</div>

<!-- Dashboard -->
<div id="dashboard">
    <div class="dash-header">
        <div class="nav-menu" id="navMenu"></div>
        <div class="user-info">
            <div class="user-avatar" id="userAvatar">B</div>
            <div>
                <div class="user-name" id="userName">black_0x000000</div>
                <div class="user-role" id="userRole">Chủ sở hữu hệ thống — toàn quyền</div>
            </div>
            <button class="logout-btn" id="logoutBtn">Đăng xuất</button>
        </div>
    </div>
    <div id="dashboardContent"></div>
</div>

<!-- Chat Modal -->
<div class="modal-overlay" id="chatModal">
    <div class="modal-box" style="max-width:600px; max-height:80vh; overflow-y:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3 style="color:#fff;" id="chatTopicTitle">💬 Chủ đề</h3>
            <button class="modal-btn cancel" id="closeChatModal" style="flex:0; padding:8px 16px;">✕</button>
        </div>
        <div id="chatMessages" style="margin-bottom:16px; max-height:300px; overflow-y:auto; background:rgba(255,255,255,0.03); border-radius:12px; padding:16px;">
            <p style="color:#8892b0; text-align:center;">Chưa có tin nhắn. Hãy bắt đầu trò chuyện!</p>
        </div>
        <div style="display:flex; gap:10px;">
            <input type="text" id="chatInput" placeholder="Nhập tin nhắn..." style="flex:1; padding:12px 16px; background:#0a0e17; border:2px solid #233554; border-radius:10px; color:#e0e0e0; font-size:14px;">
            <button class="settings-btn" id="sendChatBtn" style="flex:0; padding:12px 24px;">Gửi</button>
        </div>
        <div id="chatError" class="msg-error" style="display:none; margin-top:10px;"></div>
    </div>
</div>

<script src="js/firebase-config.js"></script>
<script src="js/toast.js"></script>
<script src="js/modal.js"></script>
<script src="js/firebase-service.js"></script>
<script src="js/render.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>

</body>
</html>
